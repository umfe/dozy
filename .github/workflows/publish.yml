name: Publish to NPM

on:
    push:
        branches:
            - main
            - master

permissions:
    contents: write

# 串行化发布：连续 push（或 main/master 同时推）时若两个 job 并行，会各自从同一旧版本
# bump 出相同新版本，导致其中一个 publish 因版本已存在而失败。排队执行可避免此竞争。
# 必须 cancel-in-progress: false —— 若中途取消已 publish 但未 commit 的 run，
# npm 上会留下无对应提交的版本，下次 bump 撞上它而卡死。
concurrency:
    group: publish-npm
    cancel-in-progress: false

jobs:
    publish:
        runs-on: ubuntu-latest
        if: "!contains(github.event.head_commit.message, '[skip ci]')"
        steps:
            - uses: actions/checkout@v4
              with:
                  token: ${{ secrets.GITHUB_TOKEN }}

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '20'
                  registry-url: 'https://registry.npmjs.org'

            - name: Install dependencies
              run: npm ci

            - name: Bump version
              id: bump
              run: |
                  node scripts/bump-version.js
                  npm install --package-lock-only --ignore-scripts

            # 不再显式 build：npm publish 会自动触发 package.json 里的 prepublishOnly 钩子完成构建
            - name: Publish to NPM
              run: |
                  if [ -z "$NODE_AUTH_TOKEN" ]; then
                    echo "::error::NODE_AUTH_TOKEN is empty. Please check that you have added NPM_TOKEN to your GitHub repository secrets."
                    exit 1
                  fi
                  npm publish --access public
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

            - name: Commit and Push Version Bump
              uses: stefanzweifel/git-auto-commit-action@v5
              with:
                  commit_message: 'chore: release v${{ steps.bump.outputs.version }} [skip ci]'
                  branch: ${{ github.ref_name }}
                  file_pattern: 'package.json src/index.ts package-lock.json'
                  # tagging_message: 'v${{ steps.bump.outputs.version }}'
