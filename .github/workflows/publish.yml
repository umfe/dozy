name: Publish to NPM

on:
    workflow_dispatch:
    push:
        branches:
            - main

permissions:
    contents: write

concurrency:
    group: publish-npm
    cancel-in-progress: false

jobs:
    publish:
        runs-on: ubuntu-latest
        if: "github.ref_name == 'main' && !contains(github.event.head_commit.message, '[skip ci]')"
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  token: ${{ secrets.GITHUB_TOKEN }}

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  registry-url: 'https://registry.npmjs.org'
                  cache: 'npm'
                  cache-dependency-path: 'package-lock.json'

            - name: Install dependencies
              run: npm ci

            - name: Bump version
              id: bump
              run: |
                  node scripts/bump-version.js
                  npm install --package-lock-only --ignore-scripts
                  echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

            - name: Publish to NPM
              run: |
                  if [ -z "$NODE_AUTH_TOKEN" ]; then
                    echo "::error::NODE_AUTH_TOKEN is empty. Please check that you have added NPM_TOKEN to your GitHub repository secrets."
                    exit 1
                  fi
                  npm publish --access public
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

            - name: Commit and Push Version Bump
              uses: stefanzweifel/git-auto-commit-action@v5
              with:
                  commit_message: 'chore: release v${{ steps.bump.outputs.version }} [skip ci]'
                  branch: ${{ github.ref_name }}
                  file_pattern: 'package.json src/index.ts package-lock.json'
