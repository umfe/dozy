name: Publish to NPM

on:
    push:
        branches:
            - main
            - master

permissions:
    contents: write

jobs:
    publish:
        runs-on: ubuntu-latest
        if: "!contains(github.event.head_commit.message, '[skip ci]')"
        steps:
            - uses: actions/checkout@v4
              with:
                  token: ${{ secrets.GITHUB_TOKEN }}

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '20'
                  registry-url: 'https://registry.npmjs.org'

            - name: Install dependencies
              run: npm ci

            - name: Bump version
              id: bump
              run: |
                  node scripts/bump-version.js
                  npm install --package-lock-only --ignore-scripts
                  VERSION=$(npm pkg get version | tr -d '"')
                  echo "NEW_VERSION=$VERSION" >> $GITHUB_ENV

            - name: Build
              run: npm run build

            - name: Publish to NPM
              run: |
                  if [ -z "$NODE_AUTH_TOKEN" ]; then
                    echo "::error::NODE_AUTH_TOKEN is empty. Please check that you have added NPM_TOKEN to your GitHub repository secrets."
                    exit 1
                  fi
                  npm publish
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

            - name: Commit and Push Version Bump
              uses: stefanzweifel/git-auto-commit-action@v5
              with:
                  commit_message: 'chore: bump version to ${{ env.NEW_VERSION }} [skip ci]'
                  branch: ${{ github.ref }}
                  file_pattern: 'package.json src/index.ts package-lock.json'
